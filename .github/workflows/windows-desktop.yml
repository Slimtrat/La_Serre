name: Windows desktop CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
    tags: ["v*"]

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality and build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci

      - name: Check frontend
        run: npm --prefix frontend run check

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Produce frontend test report
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          npm --prefix frontend run test:unit -- --reporter=default --reporter=junit --outputFile.junit=../artifacts/frontend-test-results.xml

      - name: Publish frontend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence-${{ github.run_id }}
          path: artifacts/frontend-test-results.xml
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Python quality and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop]"

      - name: Install locked frontend dependencies for contract verification
        run: npm --prefix frontend ci

      - name: Verify generated OpenAPI contract and client
        run: |
          python -m tools.export_openapi
          npm --prefix frontend run generate:api
          git diff --exit-code -- frontend/openapi.json frontend/src/generated

      - name: Lint and type-check the complete product
        run: |
          ruff check .
          mypy engine apps tools
          python -m apps.desktop --version

      - name: Check JavaScript and browser smoke sources
        shell: pwsh
        run: |
          $sources = @(
            Get-ChildItem apps/api/static -Recurse -File -Filter *.js
            Get-ChildItem tests/browser -Recurse -File -Filter *.mjs
          )
          foreach ($source in $sources) {
            node --check $source.FullName
          }

      - name: Run full suite including mocked generation E2E
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m pytest --junitxml=artifacts/test-results.xml --cov=apps --cov=engine --cov=tools --cov-report=xml:artifacts/coverage.xml --cov-report=term

      - name: Publish Python test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.run_id }}
          path: |
            artifacts/test-results.xml
            artifacts/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  browser-integration:
    name: Browser integration (FastAPI + persistence)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application and browser test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop]"
          npm --prefix frontend ci

      - name: Build the frontend served by FastAPI
        run: npm --prefix frontend run build

      - name: Run Playwright against isolated FastAPI and real persistence
        run: python -m tools.run_browser_integration --timeout 120

      - name: Publish browser traces, screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-integration-evidence-${{ github.run_id }}
          path: artifacts/browser-integration
          if-no-files-found: warn
          retention-days: 14

  feature-readiness:
    name: Feature readiness report
    needs: [frontend, quality, browser-integration]
    if: always()
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Download frontend evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: frontend-evidence-${{ github.run_id }}
          path: artifacts/evidence/frontend

      - name: Download Python evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: quality-evidence-${{ github.run_id }}
          path: artifacts/evidence/python

      - name: Download browser evidence
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: browser-integration-evidence-${{ github.run_id }}
          path: artifacts/evidence/browser

      - name: Evaluate product feature readiness
        shell: pwsh
        run: |
          python -m tools.feature_report `
            --features features `
            --python-junit artifacts/evidence/python/test-results.xml `
            --frontend-junit artifacts/evidence/frontend/frontend-test-results.xml `
            --browser-results artifacts/evidence/browser/browser-results.json `
            --gate "python=${{ needs.quality.result }}" `
            --gate "frontend=${{ needs.frontend.result }}" `
            --gate "browser=${{ needs.browser-integration.result }}" `
            --markdown artifacts/feature-readiness/feature-readiness.md `
            --json artifacts/feature-readiness/feature-readiness.json `
            --strict

      - name: Add feature readiness to the workflow summary
        if: always()
        shell: pwsh
        run: |
          $report = "artifacts/feature-readiness/feature-readiness.md"
          if (Test-Path -LiteralPath $report) {
            Get-Content -LiteralPath $report | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          } else {
            "# Feature readiness report`n`nThe report could not be generated." | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }

      - name: Publish feature readiness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-readiness-report-${{ github.run_id }}
          path: |
            artifacts/feature-readiness/feature-readiness.md
            artifacts/feature-readiness/feature-readiness.json
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build release candidates
    needs: [frontend, quality, browser-integration, feature-readiness]
    if: >-
      needs.frontend.result == 'success' &&
      needs.quality.result == 'success' &&
      needs.browser-integration.result == 'success' &&
      needs.feature-readiness.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,build]"

      - name: Build portable executable
        run: python -m tools.build_desktop

      - name: Smoke-test portable executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist\SerreStudio.exe -ArgumentList '--version' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "SerreStudio.exe exited with code $($process.ExitCode)"
          }

      - name: Launch portable executable and verify API plus React assets
        shell: pwsh
        run: |
          $smokeRoot = Join-Path $env:RUNNER_TEMP "serre-portable-smoke-${{ github.run_id }}"
          $dataRoot = Join-Path $smokeRoot "data"
          $evidenceRoot = Join-Path $PWD "artifacts\portable-smoke"
          New-Item -ItemType Directory -Force $smokeRoot, $dataRoot | Out-Null
          New-Item -ItemType Directory -Force $evidenceRoot | Out-Null
          Copy-Item -LiteralPath dist\SerreStudio.exe -Destination $smokeRoot
          $executable = Join-Path $smokeRoot "SerreStudio.exe"
          $arguments = @('--port', '8766', '--data-dir', $dataRoot)
          $process = Start-Process -FilePath $executable -ArgumentList $arguments -WorkingDirectory $smokeRoot -WindowStyle Hidden -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($process.HasExited) {
                throw "Portable application exited before health check with code $($process.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod -Uri http://127.0.0.1:8766/health -TimeoutSec 2
                if ($health.status -eq 'ok') {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "Portable application health check timed out"
            }
            $index = Invoke-WebRequest -Uri http://127.0.0.1:8766/ -UseBasicParsing
            $react = Invoke-WebRequest -Uri http://127.0.0.1:8766/static/ui/studio-react.js -UseBasicParsing
            if ($index.StatusCode -ne 200 -or $index.Content -notmatch 'studio-react-root') {
              throw "Portable application did not serve the Studio shell"
            }
            if ($react.StatusCode -ne 200 -or $react.RawContentLength -lt 1000) {
              throw "Portable application did not serve the React bundle"
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
            Get-ChildItem -LiteralPath $dataRoot -Recurse -File -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item -LiteralPath $_.FullName -Destination (Join-Path $evidenceRoot $_.Name) -Force
            }
          }

      - name: Publish portable launch evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portable-smoke-evidence-${{ github.run_id }}
          path: artifacts/portable-smoke
          if-no-files-found: warn
          retention-days: 14

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer and release files
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $env:SERRE_STUDIO_VERSION = $version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" tools\serre_studio.iss
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist\SerreStudio.exe -DestinationPath "artifacts\SerreStudio-portable-$version.zip"
          Copy-Item "dist-installer\SerreStudio-Setup-$version.exe" artifacts\
          Get-ChildItem artifacts -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Set-Content -Encoding ascii artifacts\SHA256SUMS.txt

      - name: Publish workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerreStudio-Windows
          path: artifacts/*
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "$env:GITHUB_REF_NAME" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --generate-notes --title "$env:GITHUB_REF_NAME"
          }
          gh release upload "$env:GITHUB_REF_NAME" artifacts\* --clobber
