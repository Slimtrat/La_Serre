name: Windows desktop CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/**"
      - "frontend/**"
      - "engine/**"
      - "tools/**"
      - "workflows/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"
  push:
    branches: [main, develop]
    tags: ["v*"]
    paths:
      - "apps/**"
      - "frontend/**"
      - "engine/**"
      - "tools/**"
      - "workflows/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/windows-desktop.yml"

concurrency:
  group: windows-desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend quality and build
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked frontend dependencies
        run: npm --prefix frontend ci

      - name: Check frontend
        run: npm --prefix frontend run check

      - name: Build frontend
        run: npm --prefix frontend run build

      - name: Produce frontend test report
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          npm --prefix frontend run test:unit -- --reporter=default --reporter=junit --outputFile.junit=../artifacts/frontend-test-results.xml

      - name: Publish frontend test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-evidence-${{ github.run_id }}
          path: artifacts/frontend-test-results.xml
          if-no-files-found: warn
          retention-days: 14

  quality:
    name: Python quality and tests
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install application and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,desktop]"

      - name: Install locked frontend dependencies for contract verification
        run: npm --prefix frontend ci

      - name: Verify generated OpenAPI contract and client
        run: |
          python -m tools.export_openapi
          npm --prefix frontend run generate:api
          git diff --exit-code -- frontend/openapi.json frontend/src/generated

      - name: Lint and type-check the complete product
        run: |
          ruff check .
          mypy engine apps tools
          python -m apps.desktop --version

      - name: Check JavaScript and browser smoke sources
        shell: pwsh
        run: |
          $sources = @(
            Get-ChildItem apps/api/static -Recurse -File -Filter *.js
            Get-ChildItem tests/browser -Recurse -File -Filter *.mjs
          )
          foreach ($source in $sources) {
            node --check $source.FullName
          }

      - name: Run full suite including mocked generation E2E
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          python -m pytest --junitxml=artifacts/test-results.xml --cov=apps --cov=engine --cov=tools --cov-report=xml:artifacts/coverage.xml --cov-report=term

      - name: Publish Python test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-evidence-${{ github.run_id }}
          path: |
            artifacts/test-results.xml
            artifacts/coverage.xml
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build release candidates
    needs: [frontend, quality]
    if: >-
      needs.frontend.result == 'success' &&
      needs.quality.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install desktop build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[desktop,build]"

      - name: Build portable executable
        run: python -m tools.build_desktop

      - name: Smoke-test portable executable
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist\SerreStudio.exe -ArgumentList '--version' -PassThru -Wait
          if ($process.ExitCode -ne 0) {
            throw "SerreStudio.exe exited with code $($process.ExitCode)"
          }

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer and release files
        shell: pwsh
        run: |
          $version = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $env:SERRE_STUDIO_VERSION = $version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" tools\serre_studio.iss
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Compress-Archive -Path dist\SerreStudio.exe -DestinationPath "artifacts\SerreStudio-portable-$version.zip"
          Copy-Item "dist-installer\SerreStudio-Setup-$version.exe" artifacts\
          Get-ChildItem artifacts -File | Get-FileHash -Algorithm SHA256 | ForEach-Object {
            "$($_.Hash.ToLower())  $($_.Path | Split-Path -Leaf)"
          } | Set-Content -Encoding ascii artifacts\SHA256SUMS.txt

      - name: Publish workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: SerreStudio-Windows
          path: artifacts/*
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "$env:GITHUB_REF_NAME" 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create "$env:GITHUB_REF_NAME" --generate-notes --title "$env:GITHUB_REF_NAME"
          }
          gh release upload "$env:GITHUB_REF_NAME" artifacts\* --clobber
