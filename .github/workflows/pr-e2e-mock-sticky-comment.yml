name: PR integration evidence summary

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_run:
    workflows: ["Windows desktop CI"]
    types: [completed]

permissions:
  contents: read
  checks: read
  pull-requests: write

concurrency:
  group: pr-integration-summary-${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
  cancel-in-progress: true

jobs:
  refresh-observed-results:
    name: Refresh observed integration results
    if: github.event_name == 'pull_request_target' || github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Summarize checks observed for the PR revision
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.workflow_run.pull_requests[0].number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.workflow_run.head_sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import textwrap
          import urllib.request

          marker = "<!-- serre-studio:e2e-mock-generation -->"
          repository = os.environ["REPOSITORY"]
          pull_request = os.environ["PR_NUMBER"]
          head_sha = os.environ["HEAD_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          api_root = f"https://api.github.com/repos/{repository}"
          comments_url = f"{api_root}/issues/{pull_request}/comments?per_page=100"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "serre-studio-integration-summary",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(url, *, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              call = urllib.request.Request(url, data=data, headers=headers, method=method)
              return urllib.request.urlopen(call, timeout=30)

          with request(f"{api_root}/commits/{head_sha}/check-runs?per_page=100") as response:
              check_runs = json.load(response).get("check_runs", [])

          expected = {
              "Frontend quality and build": "Composants front",
              "Python quality and tests": "Python + génération mockée",
              "Browser integration (FastAPI + persistence)": "Playwright + vrai backend",
              "Build release candidates": "Packaging + lancement binaire",
          }
          observed = {item.get("name"): item for item in check_runs}

          def state(name):
              check = observed.get(name)
              if not check:
                  return "en attente"
              return check.get("conclusion") or check.get("status") or "inconnu"

          rows = "\n".join(
              f"| {label} | `{state(name)}` |"
              for name, label in expected.items()
          )
          checks_url = f"https://github.com/{repository}/commit/{head_sha}/checks"
          body = textwrap.dedent(f"""{marker}
          ## 🌿 Preuves d’intégration observées

          **Révision :** [`{head_sha[:7]}`]({checks_url})

          | Frontière | Résultat observé |
          | --- | --- |
          {rows}
          | Benchmark GPU réel | `non exécuté en CI` |

          Le scénario navigateur lance réellement Edge contre FastAPI et une persistance temporaire. Seuls les moteurs externes restent hors de cette frontière. Les traces, captures et logs sont publiés par le job navigateur ; le packaging est explicitement `skipped` sur une PR ordinaire.

          Reproduction ciblée de la génération mockée : `python -m pytest -q tests/test_e2e_mock_generation.py tests/test_production_queue.py tests/test_episode_pipeline.py`.

          Ce résumé reflète les checks présents pour cette révision. Il est remis à jour à la fin de **Windows desktop CI** et ne transforme jamais une checklist anticipée en preuve.
          """).strip()

          comments = []
          next_url = comments_url
          while next_url:
              with request(next_url) as response:
                  comments.extend(json.load(response))
                  link = response.headers.get("Link", "")
              match = re.search(r'<([^>]+)>; rel="next"', link)
              next_url = match.group(1) if match else None

          existing = next(
              (
                  comment
                  for comment in comments
                  if marker in (comment.get("body") or "")
                  and comment.get("user", {}).get("login") == "github-actions[bot]"
              ),
              None,
          )
          if existing:
              with request(existing["url"], method="PATCH", payload={"body": body}):
                  print(f"Updated observed results for PR #{pull_request}")
          else:
              with request(comments_url, method="POST", payload={"body": body}):
                  print(f"Created observed results for PR #{pull_request}")
          PY
