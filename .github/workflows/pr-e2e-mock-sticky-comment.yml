name: PR E2E mock generation sentinel

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-e2e-mock-comment-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  upsert-collaboration-contract:
    name: Refresh the E2E collaboration comment
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Wake the greenhouse sentinel
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import urllib.request

          marker = "<!-- serre-studio:e2e-mock-generation -->"
          repository = os.environ["REPOSITORY"]
          pull_request = os.environ["PR_NUMBER"]
          head_sha = os.environ["HEAD_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          api_root = f"https://api.github.com/repos/{repository}"
          comments_url = f"{api_root}/issues/{pull_request}/comments?per_page=100"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "User-Agent": "serre-studio-e2e-sentinel",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          body = f"""{marker}
          ## 🌿 Contrôle phytosanitaire — E2E mock

          **Bourgeon inspecté :** `{head_sha[:7]}` · la sentinelle remet ce message à jour à chaque poussée de la PR.

          Pour éviter qu’une jolie feuille cache une racine cassée :

          - [x] la CI lance automatiquement la suite complète, dont l’E2E de génération mockée
          - [ ] en local, reproduire avec `python -m pytest -q tests/test_e2e_mock_generation.py tests/test_production_queue.py tests/test_episode_pipeline.py`
          - [ ] si la PR touche aux schémas, jobs, fichiers projet ou étapes média, adapter l’E2E dans **la même PR**
          - [ ] conserver l’orchestration réelle ; seuls **ComfyUI, le TTS et FFmpeg** sont doublés
          - [ ] vérifier les artefacts physiques : **3 keyframes, vidéo, voix, musique, sous-titres et master**

          <details>
          <summary>🧪 Ce que la serre teste vraiment</summary>

          FastAPI, changement de projet, Bible/casting, files de production, approbation humaine, managers asynchrones, manifestes, historique, journaux, notifications et rechargement après redémarrage.

          </details>

          > 🤝 **Règle de bouturage :** on améliore ce contrat et son test ensemble ; on ne crée pas un second sticky concurrent.
          """

          def request(url, *, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              return urllib.request.urlopen(req, timeout=30)

          comments = []
          next_url = comments_url
          while next_url:
              with request(next_url) as response:
                  comments.extend(json.load(response))
                  link = response.headers.get("Link", "")
              match = re.search(r'<([^>]+)>; rel="next"', link)
              next_url = match.group(1) if match else None

          existing = next(
              (
                  comment
                  for comment in comments
                  if marker in (comment.get("body") or "")
                  and comment.get("user", {}).get("login") == "github-actions[bot]"
              ),
              None,
          )

          if existing:
              with request(existing["url"], method="PATCH", payload={"body": body}):
                  print(f"Updated sticky comment {existing['id']} for PR #{pull_request}")
          else:
              with request(comments_url, method="POST", payload={"body": body}) as response:
                  created = json.load(response)
              print(f"Created sticky comment {created['id']} for PR #{pull_request}")
          PY
