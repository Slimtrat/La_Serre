[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "serre-des-venins"
version = "0.2.4"
description = "Studio local de production narrative assistée par IA"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
voice = [
  "edge-tts>=7.2,<8",
]
desktop = [
  "pywebview>=5.4,<7",
]
build = [
  "pyinstaller>=6.11,<7",
]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
generate-episode = "tools.generate_episode:main"
generate-shot = "tools.generate_shot:main"
serre-studio = "tools.run_studio:main"
serre-desktop = "apps.desktop.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["apps", "engine", "tools"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
